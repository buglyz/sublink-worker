name: Sub Conversion Test

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/createApp.jsx'
      - 'src/services/tempSubscriptionService.js'
      - 'src/services/proxyProviderService.js'
      - 'test/sub-conversion.test.js'
      - '.github/workflows/sub-conversion-test.yml'
  pull_request:
    paths:
      - 'src/app/createApp.jsx'
      - 'src/services/tempSubscriptionService.js'
      - 'src/services/proxyProviderService.js'
      - 'test/sub-conversion.test.js'
      - '.github/workflows/sub-conversion-test.yml'
  workflow_dispatch:

jobs:
  sub-conversion-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run subscription conversion tests
        run: npx vitest run test/sub-conversion.test.js
